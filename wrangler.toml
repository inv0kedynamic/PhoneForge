# Cloudflare Workers 配置（Worker + 静态资产）
#
# 部署命令就是 Workers Builds 默认的：
#   npx wrangler deploy
#
# 本地开发：
#   npx wrangler dev            → http://localhost:8787
#
# 说明：
# - main 指向 Worker 入口，负责 /api/telphone/* 代理
# - [assets] 把 web-static/ 作为静态资产，其余请求自动回落到 index.html
# - 若改用 Cloudflare Pages（pages deploy），见 docs/deploy-cloudflare.md

name = "phoneforge"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./web-static"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true
